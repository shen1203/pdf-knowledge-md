<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PDF 转 Markdown{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body {% block body_attributes %}{% endblock %}>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">MD</span>
      <span>
        <strong>PDF 转 Markdown</strong>
        <small>上传、转换、自动检查</small>
      </span>
    </a>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    自动检查用于发现明显遗漏，不会改写 PDF 原文。
  </footer>
</body>
</html>
