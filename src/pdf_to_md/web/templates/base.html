<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PDF Knowledge MD{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body {% block body_attributes %}{% endblock %}>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">MD</span>
      <span>
        <strong>PDF Knowledge MD</strong>
        <small>企业知识文档转换工作台</small>
      </span>
    </a>
    <span class="environment">本地功能验证版</span>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    未接入公司统一身份认证，请勿暴露到公共网络。
  </footer>
</body>
</html>
