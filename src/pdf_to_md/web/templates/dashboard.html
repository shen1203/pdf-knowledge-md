{% extends "base.html" %}
{% block title %}PDF 转 Markdown{% endblock %}
{% block content %}
<section class="simple-shell">
  <div class="simple-intro">
    <p class="eyebrow">PDF → MARKDOWN</p>
    <h1>上传 PDF，直接得到 Markdown</h1>
    <p>
      转换完成后，系统会自动核对页数、正文、关键数字、编号和重要要求，
      然后提供预览和下载。
    </p>
  </div>

  <form action="/convert" method="post" enctype="multipart/form-data"
        class="panel simple-upload-form">
    <fieldset class="mode-picker">
      <legend>选择转换模式</legend>
      <label class="mode-option">
        <input type="radio" name="mode" value="full" checked>
        <span>
          <strong>完整转换</strong>
          <small>尽量保留全部正文，只做 Markdown 结构化和必要清理。</small>
        </span>
      </label>
      <label class="mode-option">
        <input type="radio" name="mode" value="summary">
        <span>
          <strong>重点摘要</strong>
          <small>抽取标题、步骤、关键要求、数字和型号，省略非重点内容。</small>
        </span>
      </label>
    </fieldset>
    <label class="drop-zone" data-drop-zone>
      <input type="file" name="pdf" accept=".pdf,application/pdf" required>
      <span class="drop-icon">PDF</span>
      <strong>拖拽 PDF 到这里，或点击选择文件</strong>
      <small>单个文件最大 {{ max_upload_mb }} MB</small>
      <output data-file-name aria-live="polite">尚未选择文件</output>
    </label>
    <button class="primary-button large-button" type="submit" data-submit-button>
      按所选模式转换
    </button>
  </form>

  <div class="simple-note">
    <strong>自动检查什么？</strong>
    <span>页面是否齐全、正文覆盖率、关键数字和编号、必须/禁止/注意/步骤等关键句。</span>
  </div>
</section>
{% endblock %}
