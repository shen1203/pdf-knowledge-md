[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-knowledge-md"
version = "0.3.0"
description = "Auditable PDF-to-Markdown ingestion pipeline for enterprise RAG knowledge bases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pypdf>=5.0,<7",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
ocr = [
  "paddleocr>=3.0",
  "paddlepaddle>=3.0",
]
web = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]
test = [
  "httpx>=0.27,<1",
  "reportlab>=4,<5",
]

[project.scripts]
pdf-to-md = "pdf_to_md.cli:main"
pdf-to-md-web = "pdf_to_md.web.app:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pdf_to_md.web" = [
  "static/*.css",
  "static/*.js",
  "templates/*.html",
]
